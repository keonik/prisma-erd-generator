name: Publish
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # id-token: write lets GitHub mint the short-lived OIDC token that npm
  # trusted publishing exchanges for publish access — no NPM_TOKEN needed.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # NOTE: deliberately no `registry-url` here. setup-node's registry-url
      # writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`, and npm prefers
      # that (now empty) token over OIDC. Omitting it lets trusted publishing
      # engage.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - run: bun install --frozen-lockfile

      # `changeset publish` shells out to npm unless the detected package
      # manager is pnpm, so the actual publish is still `npm publish` — which
      # is what OIDC trusted publishing needs. It requires npm >= 11.5.1 and
      # Node 22 ships an older one, so upgrade the global npm. Pinned to the
      # 11.x line rather than @latest so a future npm major can't change
      # publish behavior out from under a release.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: bun run ci:publish
        env:
          # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose: with none present and a
          # trusted publisher configured on npmjs.com, npm authenticates via
          # OIDC and publishes provenance automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
