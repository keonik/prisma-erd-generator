name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, alpha]

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check

  changeset:
    # A PR that changes shipped code without a changeset merges fine and then
    # releases nothing — `sortFields` (#287) shipped in 2.4.4 and never made
    # the changelog that way. Docs/CI-only work satisfies this with
    # `bunx changeset add --empty`, which records that no release is intended.
    # Skipped on the release PR itself, which consumes every changeset.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require a changeset
        run: bunx changeset status --since=origin/main

  smoke-test:
    strategy:
      matrix:
        os: ["ubuntu-22.04", "windows-latest", "macos-latest"]
        node-version: ["20", "22"]
        prisma-version: ["5.22.0", "6.15.0", "7.0.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # bun manages dependencies, but the generator and the test runner both
      # execute on Node — `bun run` honours the shebang — so the Node matrix
      # still covers what consumers actually run.
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile && bunx puppeteer browsers install chrome-headless-shell
      - name: Print versions
        run: |
          node -v
          bun -v
      - name: build
        run: bun run build
      - name: test
        run: bun run test --run
        env:
          PRISMA_TEST_VERSIONS: ${{ matrix.prisma-version }}
